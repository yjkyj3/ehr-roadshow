<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>진단 체험하기 — EHR Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../shared.css">
<style>
/* ---- 체험 2 전용 ---- */
.me{display:grid;grid-template-columns:1fr 360px;gap:48px;align-items:start}
.events{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ev{min-height:150px;padding:22px;border-radius:var(--r-lg);background:var(--white);border:1.5px solid var(--line-2);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:16px;transition:background .15s,border-color .15s,transform .1s}
.ev:active{transform:scale(.98)}
.ev.on{background:var(--tint);border-color:var(--crimson)}
.ev .ic{font-family:var(--serif);font-size:30px;color:var(--ink-3);line-height:1}.ev.on .ic{color:var(--crimson)}
.ev .lb{font-size:18px;font-weight:600;line-height:1.35}.ev.on .lb{color:var(--crimson)}
.ev.free{border-style:dashed}
.free-in{margin-top:18px;display:none;gap:12px;align-items:center}.free-in.show{display:flex}
.free-in input{flex:1;min-height:var(--tap);border-radius:var(--r);border:1.5px solid var(--line-2);background:var(--white);color:var(--ink);padding:0 18px;font-size:17px}
.understood{margin-top:14px;font-size:15px;color:var(--ink-2)}.understood b{color:var(--crimson)}

.er{display:grid;grid-template-columns:1fr 460px;gap:36px;align-items:start}
.dials{display:flex;flex-direction:column;gap:12px}
.dial{display:grid;grid-template-columns:150px 1fr 96px;gap:16px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:12px 18px}
.dial .dn{font-size:16px;font-weight:600}.dial .dn small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:400}
.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border-radius:12px;padding:4px;height:54px}
.seg .ind{position:absolute;top:4px;bottom:4px;width:calc(25% - 2px);border-radius:9px;background:var(--white);box-shadow:0 2px 6px rgba(23,23,27,.12);transition:left .3s var(--spring),background .3s;left:4px}
.seg.l1 .ind{background:var(--hold-t)}.seg.l2 .ind{background:#F6DFC2}.seg.l3 .ind{background:#F3C9C9}
.seg.sbp.l0 .ind{background:#F3C9C9}.seg.sbp.l1 .ind{background:var(--hold-t)}.seg.sbp.l2 .ind{background:var(--white)}.seg.sbp.l3 .ind{background:var(--hold-t)}
.seg button{position:relative;z-index:1;font-size:14px;color:var(--ink-2);border-radius:9px}
.seg button.on{color:var(--ink);font-weight:700}
.dial .dv{text-align:right;font-size:23px;font-family:var(--serif);font-weight:700;font-variant-numeric:tabular-nums;color:var(--crimson)}
.dial .dv small{font-size:12px;font-family:var(--sans);color:var(--ink-3);font-weight:400;margin-left:3px}
.labs{margin-top:14px;background:var(--surface);border-radius:16px;padding:18px}
.labs .lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.labs .ll{display:flex;flex-wrap:wrap;gap:8px;min-height:40px}
.labs .lab{padding:9px 12px;border-radius:10px;background:var(--white);border:1px solid var(--line);font-size:14px;animation:pop .35s var(--spring) both}
.labs .lab b{font-variant-numeric:tabular-nums}.labs .lab.hi b,.labs .lab.vhi b{color:var(--hold)}.labs .lab.lo b{color:#1F5FA8}
.whatif{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wall-card{position:sticky;top:0}
.wall-card .wh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.wall-card .wh b{font-size:15px}
.more{margin-top:10px;font-size:13px;color:var(--ink-3);text-align:center}

.pick{display:grid;grid-template-columns:1fr 400px;gap:36px;align-items:start}
.cstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:26px}
.cs{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.cs::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--crimson)}
.cs .dx{font-weight:600;font-size:15px;min-height:44px;line-height:1.3}.cs .p{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--crimson);font-variant-numeric:tabular-nums}
.tests{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tst{min-height:100px;padding:18px;border-radius:16px;background:var(--white);border:1.5px solid var(--line-2);text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:background .15s,border-color .15s,transform .1s}
.tst:active{transform:scale(.98)}
.tst .tn{font-size:17px;font-weight:600}.tst .tf{font-size:12.5px;color:var(--ink-3)}
.tst.user{border-color:var(--crimson);background:var(--tint)}.tst.agent{border-color:var(--ok);background:var(--ok-t)}.tst.user.agent{border-color:var(--hold);background:var(--hold-t)}
.tst .tag{font-size:12px;font-weight:600;margin-top:6px}.tst.user .tag{color:var(--crimson)}.tst.agent .tag{color:var(--ok)}.tst.user.agent .tag{color:var(--hold)}
.tst[disabled]{opacity:.55}
.cmp{min-height:300px}
.cmp .vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.cmp .side{background:var(--surface);border-radius:12px;padding:14px;border-top:3px solid var(--line-2)}
.cmp .side.u{border-top-color:var(--crimson)}.cmp .side.a{border-top-color:var(--ok)}
.cmp .side .who{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}.cmp .side .tn{font-size:17px;font-weight:700}
.cmp .side .rs{font-size:13.5px;color:var(--ink-2);margin:6px 0 10px;min-height:38px}
.cmp .side .mv{font-family:var(--serif);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}.cmp .side .mv small{font-family:var(--sans);font-size:12px;color:var(--ink-3);font-weight:400;margin-left:4px}
.cmp .msg{margin-top:14px;font-size:15px;line-height:1.55}
.cmp .booth{margin-top:14px;font-size:13px;color:var(--ink-3);padding-top:12px;border-top:1px solid var(--line)}.cmp .booth b{color:var(--crimson)}
.bet{margin-top:26px;display:none}.bet.show{display:block;animation:pop .4s var(--spring) both}
.bet .bo{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.bet .bo .opt{justify-content:center;text-align:center;padding:0 10px;font-size:15px;min-height:62px;line-height:1.25}

.flow{display:flex;align-items:center;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.flow .fs{font-size:13px;padding:7px 14px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);font-weight:600}
.flow .fs.done{background:var(--tint);color:var(--crimson)}.flow .fs.cur{background:var(--crimson);color:#fff}
.flow .fa{width:14px;height:1px;background:var(--line-2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin-bottom:8px}.legend i{display:inline-block;width:14px;height:8px;border-radius:4px;margin-right:5px;vertical-align:0}.legend .lg-base{background:var(--line-2)}.legend .lg-now{background:var(--crimson)}
.dwall{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:118px 1fr 58px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.drow .n{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow.top .n{color:var(--ink);font-weight:700}
.drow .bars{display:flex;flex-direction:column;gap:4px}
.drow .bl{display:grid;grid-template-columns:1fr 40px;gap:8px;align-items:center;height:12px}
.drow .bl i{display:block;height:10px;border-radius:5px;width:0;transition:width .5s var(--spring)}
.drow .bl .base{background:var(--line-2)}.drow .bl .now{background:var(--crimson)}
.drow .bl b{font-size:11.5px;color:var(--ink-3);font-weight:500;text-align:right}.drow .bl .vn{color:var(--crimson);font-weight:700}
.drow .dd{font-size:12.5px;text-align:right;color:var(--ink-3);font-weight:600}.drow .dd.up{color:var(--crimson)}.drow .dd.down{color:#1F5FA8}
.moreall{margin-top:10px;width:100%}
.wall.ghost .prow .b{position:relative;background:transparent;overflow:visible}
.wall.ghost .prow .b .g{position:absolute;left:0;top:0;height:100%;width:0;background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px;box-sizing:border-box;transition:width .6s var(--spring)}
.wall.ghost .prow .b i:not(.g){position:relative;z-index:1}
.calib2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.calib2 .wall-card{grid-row:span 2}
.speech.out{border-left-color:var(--ink)}
.reco{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
.reco-top{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rc{background:var(--white);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:22px 20px;display:flex;flex-direction:column;gap:10px;min-height:300px;animation:pop .45s var(--spring) both;position:relative;overflow:hidden}
.rc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--line-2)}
.rc.first{border-color:var(--crimson);background:var(--tint)}.rc.first::before{background:var(--crimson)}
.rc .rk{font-size:12.5px;font-weight:700;color:var(--ink-3)}.rc.first .rk{color:var(--crimson)}
.rc .tn{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.25;min-height:60px}
.rc .mv{font-family:var(--serif);font-size:36px;font-weight:700;line-height:1;color:var(--crimson)}.rc .mv small{font-family:var(--sans);font-size:12px;color:var(--ink-3);font-weight:400;margin-left:6px}
.rc .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}.rc .bar i{display:block;height:100%;background:var(--crimson);transition:width 1s var(--spring)}
.rc .af{display:flex;flex-wrap:wrap;gap:6px}.rc .af span{font-size:12.5px;padding:4px 8px;border-radius:999px;background:var(--surface);font-weight:600}.rc .af .up{color:var(--crimson)}.rc .af .down{color:#1F5FA8}
.rc .ex{margin-top:auto;font-size:13px;color:var(--ink-2);line-height:1.5;padding-top:10px;border-top:1px dashed var(--line)}.rc .ex b{color:var(--ink);margin-right:6px}
.reco-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}.reco-list .rl{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--surface)}.reco-list .rl b{color:var(--ink-3)}
.result{display:grid;grid-template-columns:1fr 420px;gap:40px;align-items:start}
.result .rrow{grid-template-columns:1fr 150px 130px}
.score .wi{display:flex;flex-direction:column;gap:8px}
@media (max-width:1100px){.me,.er,.pick,.result,.reco,.calib2{grid-template-columns:1fr}.reco-top{grid-template-columns:1fr}.events,.tests{grid-template-columns:repeat(2,1fr)}.cstrip,.bet .bo{grid-template-columns:repeat(3,1fr)}.wall-card{position:static}}
</style>
</head>
<body>
<script src="../logos.js"></script>
<script src="../shared.js"></script>
<script src="../engine.js"></script>
<script>
buildShell({ stages: ["체험 설정", "무슨 일", "EHR 기록 → FM 확률", "LLM 보정 → 추론", "추천 검사", "경로 탐색", "결과", "판독문", "리포트"] });
const S = { env: 'er', calib: null, calibProbs: null, age: null, sex: null, chronic: [], event: null, freeText: '', vitals: { ...VITAL_DEFAULT }, labs: [], tests: [], userTest: null, agentTest: null, bet: null, trees: null };
const NOTE = '모든 확률과 판정은 브라우저 안의 대리 모델이 계산한 미리보기입니다. 서버 연결 시 실제 FM · LLM 판정으로 교체됩니다.';
function label(id) { return (AGES.find(a => a.id === id) || SEXES.find(a => a.id === id) || CHRONIC.find(a => a.id === id) || EVENTS.find(a => a.id === id) || EVENTS_OUT.find(a => a.id === id) || { label: id }).label; }
const EVS = () => S.env === 'out' ? EVENTS_OUT : EVENTS;
const envName = () => S.env === 'out' ? '외래 첫 방문' : '응급실 도착';
function setEnv(env) { S.env = env; S.event = null; S.freeText = ''; S.vitals = { ...VITAL_DEFAULT }; }
function meLabel() { return S.age ? `${S.env === 'out' ? '외래' : '응급실'} · ${label(S.age)} ${S.sex ? label(S.sex) : ''}${S.chronic.length ? ' · ' + S.chronic.map(label).join(', ') : ' · 지병 없음'}` : ''; }
Router.onEnter = (name, idx) => { Router.note(idx ? NOTE : ''); Router.who(meLabel()); };
const SC = {};
const FLOW = ['EHR 기록', 'FM 확률', 'LLM 보정', 'LLM 추론', '추천 검사'];
function flowStrip(step) { return `<div class="flow">${FLOW.map((f, i) => `<span class="fs ${i + 1 < step ? 'done' : i + 1 === step ? 'cur' : ''}">${f}</span>`).join('<i class="fa"></i>')}</div>`; }

/* ---------- landing ---------- */
SC.landing = () => {
  Router.hint('');
  const st = Store.get('ehr_demo2_stats', { n: 0 });
  $('#app').innerHTML = `<section class="scene landing">
    <svg class="ecg" viewBox="0 0 1600 160" preserveAspectRatio="none"><path d="${ecgPath()}"/></svg>
    <div>
      <div class="partners"><img src="${LOGO_KT}" alt="KT"><span class="x">×</span><img src="${LOGO_KU}" alt="고려대학교"><span class="lab">BREIN Lab</span></div>
      <p class="kicker">EHR Agent · 진단 체험하기</p>
      <h1>진단 체험하기 —<br>내가 병원에 간다면?</h1>
      <p class="lead">나이와 지병, 그날의 사건을 고르고 응급실 또는 외래로 보냅니다. EHR 기록이 FM 확률이 되고, LLM이 보정하고, 추론을 내는 흐름을 한눈에 봅니다. 핵심은 수치가 정상일 때와 이상일 때 확률이 어떻게 달라지는가입니다.</p>
      <div class="cta"><button class="btn primary big" onclick="setEnv('er');go('me')">응급실에 실려 간다면</button><button class="btn tint big" onclick="setEnv('out');go('me')">외래를 찾아간다면</button><button class="btn ghost big" onclick="location.href=HUB_URL">체험 선택으로</button></div>
      <p class="note" style="margin-top:14px;font-size:13.5px;color:var(--ink-3)">약 3분 · 실제 건강 정보는 입력하지 마세요 · 응급실은 첫 한 시간, 외래는 검진 수치와 첫 방문 기록으로 시작합니다</p>
      ${st.n ? `<p class="visits">지금까지 <b>${st.n}</b>명이 진단 체험을 해 봤습니다</p>` : ''}
    </div>
    <div class="preview"><div class="t">이렇게 설정할 수 있습니다</div>
      <div class="opts"><span class="opt on">60세 이상 · 남성</span><span class="opt on">고혈압 · 당뇨</span><span class="opt on">가슴이 조이듯 아프다</span></div>
      <div class="t">그러면 EHR Agent는</div><div class="rows" id="rows"></div>
      <div class="tags"><span class="chip crim">추천 1순위 트로포닌</span><span class="chip hold">심전도</span><span class="chip">젖산</span></div></div></section>`;
  const demo = { age: 'age_old', sex: 'sex_m', chronic: ['c_htn', 'c_dm'], event: 'e_chest', vitals: { temp: 0, hr: 2, sbp: 1, spo2: 0, rr: 1 } };
  const pr = Engine.probs(demo), top = Engine.top(pr, 6);
  $('#rows').innerHTML = top.map(d => `<div class="r"><span>${d}</span><span class="b"><i data-w="${pr[d] * 100}"></i></span><span class="v num">${fmt(pr[d])}</span></div>`).join('');
  setTimeout(() => $$('#rows i').forEach(i => i.style.width = i.dataset.w + '%'), 900);
  Router.ready('응급실에 실려 간다면');
};

/* ---------- me ---------- */
SC.me = () => {
  Router.hint('가상의 환자를 설정하는 단계입니다. 실제 건강 정보 말고 마음대로 골라 보세요. 저장되지 않습니다');
  $('#app').innerHTML = `<section class="scene">
    <div class="head"><div><h2>진단 체험하기 — 가상의 환자를 설정하세요</h2><p class="lead">나이대와 성별을 고르고, 지병을 최대 3개까지 붙여 보세요. 복용약은 지병에 따라 자동으로 따라옵니다.</p></div></div>
    <div class="me"><div>
      <div class="field"><div class="fl"><b>어디로 가나요</b><span class="sub">응급실은 첫 한 시간, 외래는 검진 수치와 첫 방문 기록</span></div><div class="opts" id="envs"><button class="opt ${S.env !== 'out' ? 'on' : ''}" data-env="er">응급실 <span class="med">도착 후 1시간</span></button><button class="opt ${S.env === 'out' ? 'on' : ''}" data-env="out">가정의학과 외래 <span class="med">첫 방문 · CDM</span></button></div></div>
      <div class="field"><div class="fl"><b>나이대</b></div><div class="opts" id="ages">${AGES.map(a => `<button class="opt" data-k="age" data-v="${a.id}">${a.label}</button>`).join('')}</div></div>
      <div class="field"><div class="fl"><b>성별</b></div><div class="opts" id="sexes">${SEXES.map(a => `<button class="opt" data-k="sex" data-v="${a.id}">${a.label}</button>`).join('')}</div></div>
      <div class="field"><div class="fl"><b>지병</b><span class="sub">최대 3개 · 없으면 그냥 넘어가세요</span></div><div class="opts" id="chronic">${CHRONIC.map(c => `<button class="opt" data-k="c" data-v="${c.id}">${c.label}${c.med ? `<span class="med">${c.med}</span>` : ''}</button>`).join('')}</div></div></div>
    <aside class="card soft"><h3>차트에 남는 기록</h3><div id="sum"></div><p class="notice">EHR Agent는 이 정보를 '기록'으로만 봅니다. 나이·성별·과거 진단·처방 코드가 관찰창 첫 줄에 들어갑니다.</p></aside></div></section>`;
  const paint = () => {
    $$('#ages .opt').forEach(b => b.classList.toggle('on', b.dataset.v === S.age)); $$('#sexes .opt').forEach(b => b.classList.toggle('on', b.dataset.v === S.sex)); $$('#chronic .opt').forEach(b => b.classList.toggle('on', S.chronic.includes(b.dataset.v)));
    const meds = S.chronic.map(c => CHRONIC.find(x => x.id === c).med).filter(Boolean);
    $('#sum').innerHTML = `<div class="kv"><span>나이 · 성별</span><b>${S.age ? label(S.age) : '—'} ${S.sex ? label(S.sex) : ''}</b></div><div class="kv"><span>과거 진단</span><b>${S.chronic.length ? S.chronic.map(label).join(', ') : '없음'}</b></div><div class="kv"><span>복용 처방</span><b>${meds.length ? meds.join(', ') : '없음'}</b></div>`;
    Router.who(meLabel()); if (S.age && S.sex) Router.ready('무슨 일이 있었나요'); else Router.block('나이와 성별을 골라 주세요');
  };
  $('#app').onclick = e => { const ev = e.target.closest('[data-env]'); if (ev) { setEnv(ev.dataset.env); $$('#envs .opt').forEach(x => x.classList.toggle('on', x === ev)); Router.who(meLabel()); return; }

      await typeInto(x.querySelector('.lt'), (r.judge === 'auto' ? '임계값 판정 · ' : 'LLM 판정 · ') + r.text, 70); await wait(200);
    }
    const last = S.trees[d][S.trees[d].length - 1]; const cls = last.verdict === '확정' ? 'ok' : last.verdict === '배제' ? 'out' : 'unc'; el.classList.add(cls);
    el.querySelector('.vwrap').innerHTML = stampHTML(last.verdict, last.verdict === '확정' ? '최종 목록에 포함' : last.verdict === '배제' ? '최종 목록에서 제외' : last.after >= 0.6 ? '불확실 · 목록에 포함' : '불확실 · 목록에 미포함'); stampIn(el.querySelector('.stamp'));
  };
  await Promise.all(cands.map((d, i) => run(d, i * 500)));
  Router.ready('결과 보기');
};

/* ---------- result ---------- */
function finals() { return Object.entries(S.trees).map(([dx, rs]) => { const l = rs[rs.length - 1]; return { dx, p0: rs[0].before, p1: l.after, verdict: l.verdict, included: l.verdict === '확정' || (l.verdict === '불확실' && l.after >= 0.6), why: l.text }; }); }
SC.result = () => {
  if (!S.trees) return go('tree');
  const rows = finals(); const betHit = S.bet && rows.find(r => r.dx === S.bet)?.verdict === '확정';
  Router.hint('가상 설정이라 정답은 없습니다. EHR Agent가 어디까지 확신했고 무엇을 불확실로 남겼는지 보세요');
  $('#app').innerHTML = `<section class="scene">
    <div class="head"><div><h2>결과 — EHR Agent가 ${S.env === 'out' ? '첫 방문에' : '1시간 안에'} 내린 판단</h2><p class="lead">${meLabel()} · ${label(S.event)}. 확정은 목록에 넣고, 배제는 뺐으며, 확신에 못 미친 것은 불확실로 남겼습니다.</p></div></div>
    <div class="result"><div class="rlist">${rows.map((r, i) => `<div class="rrow" style="animation-delay:${i * 80}ms"><span class="dx">${esc(r.dx)}<small>${r.included ? '최종 목록에 포함' : '목록에서 제외'}</small></span><span class="num">${fmt(r.p0)} → ${fmt(r.p1)}</span><span><span class="chip ${r.verdict === '확정' ? 'crim' : r.verdict === '배제' ? 'out' : 'hold'}">${r.verdict}</span></span><span class="why">${esc(r.why)}</span></div>`).join('')}</div>
    <aside class="score"><div class="big num">${rows.filter(r => r.verdict === '확정').length} 확정<small>${rows.filter(r => r.verdict === '배제').length} 배제 · ${rows.filter(r => r.verdict === '불확실').length} 불확실</small></div>
      ${S.bet ? `<div class="badge ${betHit ? 'ok' : 'bad'}">${betHit ? `나의 선택 적중 — ${esc(S.bet)}이 확정됐습니다` : `나의 선택 빗나감 — ${esc(S.bet)}은 ${rows.find(r => r.dx === S.bet)?.verdict}`}</div>` : ''}
      <div class="row"><span>EHR Agent 추천 검사</span><b>${S.tests.map(x => x.name).join(' · ')}</b></div>
      <div class="row"><span>LLM 판정 문장</span><b class="num">${Object.values(S.trees).flat().filter(r => r.judge === 'llm').length}개</b></div>
      <div class="wi"><span class="sub">만약에 다시 해 본다면</span><button class="btn small ghost" id="wi1">지병을 바꿔서 다시</button><button class="btn small ghost" id="wi2">같은 설정, 활력징후만 바꿔서</button></div></aside></div></section>`;
  $('#wi1').onclick = () => go('me'); $('#wi2').onclick = () => go('er');
  Router.ready('임상 판독문 보기');
};

/* ---------- doc (임상 판독문) ---------- */
SC.doc = () => {
  if (!S.trees) return go('tree');
  Router.hint('의사가 보는 판독문입니다. 라운드마다 후보 전체의 확률과 요청·결과·판정이 표로 정리됩니다');
  const cands = Object.keys(S.trees); const pr0 = {}; cands.forEach(d => pr0[d] = S.trees[d][0].before);
  const unc = cands.filter(d => S.trees[d][S.trees[d].length - 1].verdict !== '배제');
  const rec = [...new Set([...(S.tests || []).map(x => x.name), ...unc.flatMap(d => { const rs = S.trees[d]; return rs[rs.length - 1].verdict === '불확실' ? rs[rs.length - 1].request : []; })])].slice(0, 6);
  const cal = $('#app'); cal.innerHTML = `<section class="scene"><div class="head"><div><h2>임상 판독문</h2><p class="lead">의료진이 읽는 형식입니다. 요약 → 초기 평가 → 라운드별 경과 → 최종 소견 순으로, 각 라운드에서 후보 전체의 확률이 어떻게 놓였고 무엇을 요청했는지가 남습니다.</p></div></div>
    <div class="docwrap">${docHTML({ title: `${label(S.event)} — ${envName()} 판독`, who: meLabel(), when: envName(), calib: `첫 시점 활력징후 ${Object.entries(VITALS).map(([k, v]) => v.label + ' ' + v.vals[S.vitals[k]]).join(', ')} · 채혈 ${S.labs.map(l => l.name + ' ' + l.value).join(', ')}`, cands: cands.map(d => ({ dx: d, p0: pr0[d] })), trees: S.trees, fetchedText: f => f.map(x => x.name + ' ' + x.text).join('; '), recommend: rec, note: '이 판독문은 가상 환자 설정에 대한 EHR Agent 동작 시연이며 실제 진료·진단과 무관합니다. 서버 연결 시 실제 FM·LLM 출력으로 교체됩니다.' })}
      <aside class="docside"><button class="btn primary" onclick="window.print()">인쇄 · PDF 저장</button><button class="btn ghost" onclick="go('report')">체험 리포트로</button><p class="notice">권고 검사는 1순위 추천 검사와, 불확실로 남은 후보의 마지막 요청 항목을 모았습니다.</p></aside></div></section>`;
  Router.ready('체험 리포트');
};

/* ---------- report ---------- */
SC.report = () => {
  if (!S.trees) return go('tree');
  Router.hint('카드를 저장해 가져가세요. 개인 정보는 담기지 않습니다'); const rows = finals();
  $('#app').innerHTML = `<section class="scene">
    <div class="head"><div><h2>체험 리포트</h2><p class="lead">설정한 가상 환자가 첫 시점의 기록으로 EHR Agent에게 어떻게 보였는지 한 장으로.</p></div></div>
    <div class="report"><canvas id="cv" width="1400" height="820"></canvas>
      <div class="acts"><button class="btn primary big" id="save">카드 이미지 저장</button><button class="btn ghost" onclick="go('me')">다른 설정으로 다시</button><button class="btn ghost" onclick="setEnv(S.env === 'out' ? 'er' : 'out'); go('me')">${S.env === 'out' ? '이번엔 응급실로' : '이번엔 외래로'}</button><button class="btn ghost" onclick="location.href='../demo1/index.html'">실사례 환자 따라가기</button><button class="btn ghost" onclick="location.href=HUB_URL">체험 선택으로</button>
        <p class="notice">이 카드는 가상 환자 설정에 대한 EHR Agent 동작 시연이며 실제 진료·진단과 무관합니다. 입력한 내용은 저장되지 않습니다.</p></div></div></section>`;
  const c = $('#cv'), x = c.getContext('2d'); const serif = '"Noto Serif KR","Nanum Myeongjo",serif', sans = '"Pretendard Variable",Pretendard,-apple-system,sans-serif';
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, 1400, 820); x.fillStyle = '#8A1538'; x.fillRect(0, 0, 1400, 8);
  x.fillStyle = '#8B8E96'; x.font = `500 20px ${sans}`; x.fillText('KT × 고려대학교 BREIN Lab · EHR Agent 체험', 64, 72);
  x.fillStyle = '#17171B'; x.font = `700 48px ${serif}`; x.fillText('진단 체험 리포트', 64, 134);
  x.fillStyle = '#55585F'; x.font = `400 24px ${sans}`; x.fillText(meLabel(), 64, 180); x.fillText(`${envName()} · ${label(S.event)}`, 64, 214);
  x.fillStyle = '#8B8E96'; x.font = `400 19px ${sans}`; x.fillText((S.env === 'out' ? '접수 시 ' : '도착 시 ') + Object.entries(VITALS).map(([k, v]) => `${v.label} ${v.vals[S.vitals[k]]}`).join('   '), 64, 252);
  x.strokeStyle = '#E3E4E9'; x.beginPath(); x.moveTo(64, 284); x.lineTo(1336, 284); x.stroke();
  let y = 330; x.fillStyle = '#55585F'; x.font = `600 20px ${sans}`; x.fillText('EHR Agent의 판정', 64, y); y += 36;
  rows.forEach(r => { const col = r.verdict === '확정' ? '#8A1538' : r.verdict === '배제' ? '#8B8F98' : '#B7791F'; x.fillStyle = col; x.beginPath(); x.arc(76, y - 8, 7, 0, Math.PI * 2); x.fill(); x.fillStyle = '#17171B'; x.font = `600 24px ${sans}`; x.fillText(r.dx, 98, y); x.fillStyle = col; x.font = `600 20px ${sans}`; x.fillText(r.verdict, 420, y); x.fillStyle = '#8B8E96'; x.font = `400 20px ${sans}`; x.fillText(`${fmt(r.p0)} → ${fmt(r.p1)}`, 540, y); y += 44; });
  const rx = 760; y = 330; x.fillStyle = '#55585F'; x.font = `600 20px ${sans}`; x.fillText('EHR Agent 추천 검사', rx, y); y += 40;
  S.tests.forEach((tt, i) => { x.fillStyle = '#8A1538'; x.font = `500 20px ${sans}`; x.fillText(`${i + 1}순위`, rx, y); x.fillStyle = '#17171B'; x.font = `600 26px ${sans}`; x.fillText(tt.name, rx + 90, y); y += 42; });
  y += 18;
  const llm = Object.values(S.trees).flat().find(r => r.judge === 'llm');
  if (llm) { x.fillStyle = '#55585F'; x.font = `600 20px ${sans}`; x.fillText('판정 근거 한 줄', rx, y); y += 32; x.fillStyle = '#17171B'; x.font = `400 19px ${sans}`; let line = ''; for (const ch of llm.text) { const t = line + ch; if (x.measureText(t).width > 560) { x.fillText(line, rx, y); line = ch; y += 28; if (y > 740) break; } else line = t; } x.fillText(line, rx, y); }
  x.fillStyle = '#8B8E96'; x.font = `400 16px ${sans}`; x.fillText('가상 환자 설정에 대한 EHR Agent 동작 시연입니다. 실제 진료·진단과 무관하며 개인 정보는 저장되지 않습니다.', 64, 784);
  $('#save').onclick = () => { const a = document.createElement('a'); a.download = 'ehr-agent-report.png'; a.href = c.toDataURL('image/png'); a.click(); };
  Router.ready('처음으로');
};

Router.init(['landing', 'me', 'event', 'er', 'calib', 'pick', 'tree', 'result', 'doc', 'report'], SC);
const _origNext = Router.next.bind(Router); Router.next = function () { if (this.current === 'landing') { setEnv(S.env || 'er'); } _origNext(); };
Idle.start(); go('landing');
</script>
</body>
</html>
