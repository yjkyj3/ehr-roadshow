<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>가상 아바타 만들기 — EHR Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../shared.css">
<style>
/* ---- 체험 2 전용 ---- */
.me{display:grid;grid-template-columns:1fr 360px;gap:48px;align-items:start}
.events{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ev{min-height:150px;padding:22px;border-radius:var(--r-lg);background:var(--white);border:1.5px solid var(--line-2);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:16px;transition:background .15s,border-color .15s,transform .1s}
.ev:active{transform:scale(.98)}
.ev.on{background:var(--tint);border-color:var(--crimson)}
.ev .ic{font-family:var(--serif);font-size:30px;color:var(--ink-3);line-height:1}.ev.on .ic{color:var(--crimson)}
.ev .lb{font-size:18px;font-weight:600;line-height:1.35}.ev.on .lb{color:var(--crimson)}
.ev.free{border-style:dashed}
.free-in{margin-top:18px;display:none;gap:12px;align-items:center}.free-in.show{display:flex}
.free-in input{flex:1;min-height:var(--tap);border-radius:var(--r);border:1.5px solid var(--line-2);background:var(--white);color:var(--ink);padding:0 18px;font-size:17px}
.understood{margin-top:14px;font-size:15px;color:var(--ink-2)}.understood b{color:var(--crimson)}

.er{display:grid;grid-template-columns:1fr 460px;gap:36px;align-items:start}
.dials{display:flex;flex-direction:column;gap:12px}
.dial{display:grid;grid-template-columns:150px 1fr 96px;gap:16px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:12px 18px}
.dial .dn{font-size:16px;font-weight:600}.dial .dn small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:400}
.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border-radius:12px;padding:4px;height:54px}
.seg .ind{position:absolute;top:4px;bottom:4px;width:calc(25% - 2px);border-radius:9px;background:var(--white);box-shadow:0 2px 6px rgba(23,23,27,.12);transition:left .3s var(--spring),background .3s;left:4px}
.seg.l1 .ind{background:var(--hold-t)}.seg.l2 .ind{background:#F6DFC2}.seg.l3 .ind{background:#F3C9C9}
.seg.sbp.l0 .ind{background:#F3C9C9}.seg.sbp.l1 .ind{background:var(--hold-t)}.seg.sbp.l2 .ind{background:var(--white)}.seg.sbp.l3 .ind{background:var(--hold-t)}
.seg button{position:relative;z-index:1;font-size:14px;color:var(--ink-2);border-radius:9px}
.seg button.on{color:var(--ink);font-weight:700}
.dial .dv{text-align:right;font-size:23px;font-family:var(--serif);font-weight:700;font-variant-numeric:tabular-nums;color:var(--crimson)}
.dial .dv small{font-size:12px;font-family:var(--sans);color:var(--ink-3);font-weight:400;margin-left:3px}
.labs{margin-top:14px;background:var(--surface);border-radius:16px;padding:18px}
.labs .lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.labs .ll{display:flex;flex-wrap:wrap;gap:8px;min-height:40px}
.labs .lab{padding:9px 12px;border-radius:10px;background:var(--white);border:1px solid var(--line);font-size:14px;animation:pop .35s var(--spring) both}
.labs .lab b{font-variant-numeric:tabular-nums}.labs .lab.hi b,.labs .lab.vhi b{color:var(--hold)}.labs .lab.lo b{color:#1F5FA8}
.whatif{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wall-card{position:sticky;top:0}
.wall-card .wh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.wall-card .wh b{font-size:15px}
.more{margin-top:10px;font-size:13px;color:var(--ink-3);text-align:center}

.pick{display:grid;grid-template-columns:1fr 400px;gap:36px;align-items:start}
.cstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:26px}
.cs{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.cs::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--crimson)}
.cs .dx{font-weight:600;font-size:15px;min-height:44px;line-height:1.3}.cs .p{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--crimson);font-variant-numeric:tabular-nums}
.tests{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tst{min-height:100px;padding:18px;border-radius:16px;background:var(--white);border:1.5px solid var(--line-2);text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:background .15s,border-color .15s,transform .1s}
.tst:active{transform:scale(.98)}
.tst .tn{font-size:17px;font-weight:600}.tst .tf{font-size:12.5px;color:var(--ink-3)}
.tst.user{border-color:var(--crimson);background:var(--tint)}.tst.agent{border-color:var(--ok);background:var(--ok-t)}.tst.user.agent{border-color:var(--hold);background:var(--hold-t)}
.tst .tag{font-size:12px;font-weight:600;margin-top:6px}.tst.user .tag{color:var(--crimson)}.tst.agent .tag{color:var(--ok)}.tst.user.agent .tag{color:var(--hold)}
.tst[disabled]{opacity:.55}
.cmp{min-height:300px}
.cmp .vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.cmp .side{background:var(--surface);border-radius:12px;padding:14px;border-top:3px solid var(--line-2)}
.cmp .side.u{border-top-color:var(--crimson)}.cmp .side.a{border-top-color:var(--ok)}
.cmp .side .who{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}.cmp .side .tn{font-size:17px;font-weight:700}
.cmp .side .rs{font-size:13.5px;color:var(--ink-2);margin:6px 0 10px;min-height:38px}
.cmp .side .mv{font-family:var(--serif);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}.cmp .side .mv small{font-family:var(--sans);font-size:12px;color:var(--ink-3);font-weight:400;margin-left:4px}
.cmp .msg{margin-top:14px;font-size:15px;line-height:1.55}
.cmp .booth{margin-top:14px;font-size:13px;color:var(--ink-3);padding-top:12px;border-top:1px solid var(--line)}.cmp .booth b{color:var(--crimson)}
.bet{margin-top:26px;display:none}.bet.show{display:block;animation:pop .4s var(--spring) both}
.bet .bo{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.bet .bo .opt{justify-content:center;text-align:center;padding:0 10px;font-size:15px;min-height:62px;line-height:1.25}

.result{display:grid;grid-template-columns:1fr 420px;gap:40px;align-items:start}
.result .rrow{grid-template-columns:1fr 150px 130px}
.score .wi{display:flex;flex-direction:column;gap:8px}
@media (max-width:1100px){.me,.er,.pick,.result{grid-template-columns:1fr}.events,.tests{grid-template-columns:repeat(2,1fr)}.cstrip,.bet .bo{grid-template-columns:repeat(3,1fr)}.wall-card{position:static}}
</style>
</head>
<body>
<script src="../logos.js"></script>
<script src="../shared.js"></script>
<script src="../engine.js"></script>
<script>
buildShell({ stages: ["아바타 만들기", "무슨 일", "첫 측정", "검사 고르기", "경로 탐색", "결과", "리포트"] });
const S = { env: 'er', age: null, sex: null, chronic: [], event: null, freeText: '', vitals: { ...VITAL_DEFAULT }, labs: [], tests: [], userTest: null, agentTest: null, bet: null, trees: null };
const NOTE = '모든 확률과 판정은 브라우저 안의 대리 모델이 계산한 미리보기입니다. 서버 연결 시 실제 FM · LLM 판정으로 교체됩니다.';
function label(id) { return (AGES.find(a => a.id === id) || SEXES.find(a => a.id === id) || CHRONIC.find(a => a.id === id) || EVENTS.find(a => a.id === id) || EVENTS_OUT.find(a => a.id === id) || { label: id }).label; }
const EVS = () => S.env === 'out' ? EVENTS_OUT : EVENTS;
const envName = () => S.env === 'out' ? '외래 첫 방문' : '응급실 도착';
function setEnv(env) { S.env = env; S.event = null; S.freeText = ''; S.vitals = { ...VITAL_DEFAULT }; }
function meLabel() { return S.age ? `${S.env === 'out' ? '외래' : '응급실'} · ${label(S.age)} ${S.sex ? label(S.sex) : ''}${S.chronic.length ? ' · ' + S.chronic.map(label).join(', ') : ' · 지병 없음'}` : ''; }
Router.onEnter = (name, idx) => { Router.note(idx ? NOTE : ''); Router.who(meLabel()); };
const SC = {};

/* ---------- landing ---------- */
SC.landing = () => {
  Router.hint('');
  const st = Store.get('ehr_demo2_stats', { n: 0, same: 0, win: 0 });
  $('#app').innerHTML = `<section class="scene landing">
    <svg class="ecg" viewBox="0 0 1600 160" preserveAspectRatio="none"><path d="${ecgPath()}"/></svg>
    <div>
      <div class="partners"><img src="${LOGO_KT}" alt="KT"><span class="x">×</span><img src="${LOGO_KU}" alt="고려대학교"><span class="lab">BREIN Lab</span></div>
      <p class="kicker">EHR Agent · 가상 아바타 만들기</p>
      <h1>가상 아바타를 만들고,<br>EHR Agent와<br>검사 고르기 게임</h1>
      <p class="lead">나이와 지병, 그날의 사건을 고르면 가상 아바타가 만들어집니다. 활력징후를 돌릴 때마다 25개 진단의 가능성이 실시간으로 움직이고, 그다음엔 "지금 검사 하나만 고른다면"을 놓고 EHR Agent와 게임을 합니다.</p>
      <div class="cta"><button class="btn primary big" onclick="setEnv('er');go('me')">응급실에 실려 간다면</button><button class="btn tint big" onclick="setEnv('out');go('me')">외래를 찾아간다면</button><button class="btn ghost big" onclick="location.href=HUB_URL">체험 선택으로</button></div>
      <p class="note" style="margin-top:14px;font-size:13.5px;color:var(--ink-3)">약 3분 · 실제 건강 정보는 입력하지 마세요 · 응급실은 첫 한 시간, 외래는 검진 수치와 첫 방문 기록으로 시작합니다</p>
      ${st.n ? `<p class="visits">지금까지 <b>${st.n}</b>명이 도전해 <b>${Math.round(st.same / st.n * 100)}%</b>가 EHR Agent와 같은 검사를 골랐습니다</p>` : ''}
    </div>
    <div class="preview"><div class="t">이런 아바타를 만들 수 있습니다</div>
      <div class="opts"><span class="opt on">60세 이상 · 남성</span><span class="opt on">고혈압 · 당뇨</span><span class="opt on">가슴이 조이듯 아프다</span></div>
      <div class="t">그러면 EHR Agent는</div><div class="rows" id="rows"></div>
      <div class="tags"><span class="chip crim">트로포닌 먼저</span><span class="chip hold">심전도</span><span class="chip">젖산</span></div></div></section>`;
  const demo = { age: 'age_old', sex: 'sex_m', chronic: ['c_htn', 'c_dm'], event: 'e_chest', vitals: { temp: 0, hr: 2, sbp: 1, spo2: 0, rr: 1 } };
  const pr = Engine.probs(demo), top = Engine.top(pr, 6);
  $('#rows').innerHTML = top.map(d => `<div class="r"><span>${d}</span><span class="b"><i data-w="${pr[d] * 100}"></i></span><span class="v num">${fmt(pr[d])}</span></div>`).join('');
  setTimeout(() => $$('#rows i').forEach(i => i.style.width = i.dataset.w + '%'), 900);
  Router.ready('응급실에 실려 간다면');
};

/* ---------- me ---------- */
SC.me = () => {
  Router.hint('실제 건강 정보가 아니라 가상 아바타를 만드는 단계입니다. 저장되지 않습니다');
  $('#app').innerHTML = `<section class="scene">
    <div class="head"><div><h2>가상 아바타를 만드세요</h2><p class="lead">나이대와 성별을 고르고, 지병이 있다면 최대 3개까지. 복용약은 지병에 따라 자동으로 붙습니다.</p></div></div>
    <div class="me"><div>
      <div class="field"><div class="fl"><b>어디로 가나요</b><span class="sub">응급실은 첫 한 시간, 외래는 검진 수치와 첫 방문 기록</span></div><div class="opts" id="envs"><button class="opt ${S.env !== 'out' ? 'on' : ''}" data-env="er">응급실 <span class="med">도착 후 1시간</span></button><button class="opt ${S.env === 'out' ? 'on' : ''}" data-env="out">가정의학과 외래 <span class="med">첫 방문 · CDM</span></button></div></div>
      <div class="field"><div class="fl"><b>나이대</b></div><div class="opts" id="ages">${AGES.map(a => `<button class="opt" data-k="age" data-v="${a.id}">${a.label}</button>`).join('')}</div></div>
      <div class="field"><div class="fl"><b>성별</b></div><div class="opts" id="sexes">${SEXES.map(a => `<button class="opt" data-k="sex" data-v="${a.id}">${a.label}</button>`).join('')}</div></div>
      <div class="field"><div class="fl"><b>지병</b><span class="sub">최대 3개 · 없으면 그냥 넘어가세요</span></div><div class="opts" id="chronic">${CHRONIC.map(c => `<button class="opt" data-k="c" data-v="${c.id}">${c.label}${c.med ? `<span class="med">${c.med}</span>` : ''}</button>`).join('')}</div></div></div>
    <aside class="card soft"><h3>차트에 남는 아바타</h3><div id="sum"></div><p class="notice">EHR Agent는 이 정보를 '기록'으로만 봅니다. 나이·성별·과거 진단·처방 코드가 관찰창 첫 줄에 들어갑니다.</p></aside></div></section>`;
  const paint = () => {
    $$('#ages .opt').forEach(b => b.classList.toggle('on', b.dataset.v === S.age)); $$('#sexes .opt').forEach(b => b.classList.toggle('on', b.dataset.v === S.sex)); $$('#chronic .opt').forEach(b => b.classList.toggle('on', S.chronic.includes(b.dataset.v)));
    const meds = S.chronic.map(c => CHRONIC.find(x => x.id === c).med).filter(Boolean);
    $('#sum').innerHTML = `<div class="kv"><span>나이 · 성별</span><b>${S.age ? label(S.age) : '—'} ${S.sex ? label(S.sex) : ''}</b></div><div class="kv"><span>과거 진단</span><b>${S.chronic.length ? S.chronic.map(label).join(', ') : '없음'}</b></div><div class="kv"><span>복용 처방</span><b>${meds.length ? meds.join(', ') : '없음'}</b></div>`;
    Router.who(meLabel()); if (S.age && S.sex) Router.ready('무슨 일이 있었나요'); else Router.block('나이와 성별을 골라 주세요');
  };
  $('#app').onclick = e => { const ev = e.target.closest('[data-env]'); if (ev) { setEnv(ev.dataset.env); $$('#envs .opt').forEach(x => x.classList.toggle('on', x === ev)); Router.who(meLabel()); return; }
    const b = e.target.closest('.opt[data-k]'); if (!b) return; if (b.dataset.k === 'age') S.age = b.dataset.v; if (b.dataset.k === 'sex') S.sex = b.dataset.v; if (b.dataset.k === 'c') { const v = b.dataset.v; S.chronic = S.chronic.includes(v) ? S.chronic.filter(x => x !== v) : (S.chronic.length < 3 ? [...S.chronic, v] : S.chronic); } paint(); };
  paint();
};

/* ---------- event ---------- */
SC.event = () => {
  Router.hint('하나만 고릅니다. 직접 쓰면 EHR Agent가 이해한 대로 카드로 되돌려 줍니다');
  $('#app').innerHTML = `<section class="scene">
    <div class="head"><div><h2>${S.env === 'out' ? '무슨 일로 오셨나요?' : '무슨 일이 있었나요?'}</h2><p class="lead">${S.env === 'out' ? '외래를 찾게 된 이유입니다. 이것이 EHR Agent가 보는 \'주 호소\'가 되고, 첫 방문 기록의 출발점이 됩니다.' : '응급실에 오게 된 사건입니다. 이것이 EHR Agent가 보는 \'주 호소\'가 되고, 도착 시 활력징후의 출발점이 됩니다.'}</p></div></div>
    <div class="events">${EVS().map(e => `<button class="ev" data-v="${e.id}"><span class="ic">${e.icon}</span><span class="lb">${e.label}</span></button>`).join('')}<button class="ev free" data-v="free"><span class="ic">✎</span><span class="lb">직접 쓰기</span></button></div>
    <div class="free-in" id="fi"><input id="ft" placeholder="${S.env === 'out' ? '예) 요즘 자꾸 목이 마르고 화장실을 자주 가요' : '예) 계단에서 넘어졌는데 허리가 너무 아파요'}" maxlength="60" autocomplete="off"><button class="btn small primary" id="fgo">이해했는지 보기</button></div>
    <div class="understood" id="und"></div></section>`;
  const paint = () => { $$('.ev').forEach(b => b.classList.toggle('on', b.dataset.v === S.event || (b.dataset.v === 'free' && !!S.freeText && !!S.event))); if (S.event) Router.ready(S.env === 'out' ? '외래로' : '응급실로'); else Router.block('사건을 골라 주세요'); };
  $$('.ev').forEach(b => b.onclick = () => { if (b.dataset.v === 'free') { $('#fi').classList.add('show'); $('#ft').focus(); return; } S.event = b.dataset.v; S.freeText = ''; S.vitals = { ...EVS().find(e => e.id === S.event).vit }; $('#und').textContent = ''; $('#fi').classList.remove('show'); paint(); });
  $('#fgo').onclick = () => { const t = $('#ft').value.trim(); if (!t) return; const g = Engine.guessEvent(t, S.env); if (g) { S.event = g; S.freeText = t; S.vitals = { ...EVS().find(e => e.id === g).vit }; $('#und').innerHTML = `이렇게 이해했어요: <b>${label(g)}</b> — 다르면 위 카드에서 직접 고르세요. 쓴 문장은 저장되지 않습니다.`; } else { S.event = null; $('#und').textContent = '아직 어떤 사건인지 잡히지 않았어요. 몸의 어디가 어떻게 아픈지 한 단어만 더 적거나, 위 카드에서 가까운 것을 골라 주세요.'; } paint(); };
  $('#ft').addEventListener('keydown', e => { if (e.key === 'Enter') $('#fgo').click(); });
  paint();
};

/* ---------- er ---------- */
SC.er = () => {
  if (!S.event) return go('event');
  Router.hint(S.env === 'out' ? '단계를 누를 때마다 오른쪽 확률이 바로 움직입니다. 검진 패널이 들어오면 다시 한번 움직입니다' : '단계를 누를 때마다 오른쪽 확률이 바로 움직입니다. 채혈 결과가 도착하면 다시 한번 움직입니다');
  S.labs = []; S.tests = []; S.userTest = null; S.agentTest = null; S.bet = null; wallReset();
  $('#app').innerHTML = `<section class="scene">
    <div class="head"><div><h2>${S.env === 'out' ? '외래 첫 방문 — 첫 측정' : '응급실 도착 — 첫 측정'}</h2><p class="lead">${label(S.event)}. ${S.env === 'out' ? '접수 때 잰 활력징후를 당신이 정합니다. 외래에서는 대개 정상 근처지만, 혈압처럼 하나만 벗어나도 확률이 움직입니다.' : '간호사가 잰 활력징후를 당신이 정합니다. 숫자를 몰라도 됩니다. 정상인지, 얼마나 벗어났는지만 고르세요.'}</p></div></div>
    <div class="er"><div>

  x.fillStyle = '#8B8E96'; x.font = `400 16px ${sans}`; x.fillText('가상 아바타에 대한 EHR Agent 동작 시연입니다. 실제 진료·진단과 무관하며 개인 정보는 저장되지 않습니다.', 64, 784);
  $('#save').onclick = () => { const a = document.createElement('a'); a.download = 'ehr-agent-avatar-report.png'; a.href = c.toDataURL('image/png'); a.click(); };
  Router.ready('처음으로');
};

Router.init(['landing', 'me', 'event', 'er', 'pick', 'tree', 'result', 'report'], SC);
const _origNext = Router.next.bind(Router); Router.next = function () { if (this.current === 'landing') { setEnv(S.env || 'er'); } _origNext(); };
Idle.start(); go('landing');
</script>
