<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>실사례 환자 따라가기 — EHR Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../shared.css">
<style>
/* ---- 체험 1 전용 ---- */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pcard{text-align:left;background:var(--white);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:26px;display:flex;flex-direction:column;gap:14px;min-height:250px;transition:transform .15s var(--ease),border-color .2s,background .2s;position:relative;overflow:hidden}
.pcard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--crimson);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.pcard:active{transform:scale(.985);border-color:var(--crimson)}
.pcard:active::after{transform:scaleX(1)}
.pcard .axis{font-size:13px;color:var(--crimson);font-weight:600}
.pcard .axis.fm{color:#1F5FA8}
.pcard .name{font-family:var(--serif);font-size:27px;font-weight:700}
.pcard .meta{font-size:14.5px;color:var(--ink-2)}
.pcard .go{margin-top:auto;font-weight:600;font-size:14.5px;color:var(--ink);display:flex;align-items:center;gap:8px}
.pcard .go::after{content:"";width:22px;height:1px;background:currentColor}
.pcard.empty{border-style:dashed;justify-content:center;align-items:center;color:var(--ink-3);text-align:center}
.pcard.empty:active{transform:none;border-color:var(--line)}

.window{display:grid;grid-template-columns:1fr 380px;gap:44px;align-items:start}
.records{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rec{display:grid;grid-template-columns:64px 88px 1fr auto;gap:18px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);opacity:0;transform:translateX(-12px);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.rec.in{opacity:1;transform:none}
.rec .t{color:var(--ink-3);font-size:14px}
.rec .k{font-size:12.5px;color:var(--ink-2);padding:3px 9px;border-radius:6px;background:var(--surface-2);width:max-content}
.rec .n{font-size:17px}.rec .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.rec .v.high{color:var(--hold)}.rec .v.low{color:#1F5FA8}
.aside{position:sticky;top:0}
.psum{font-size:13.5px;line-height:1.65;color:var(--ink-2);margin:12px 0 4px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.stat b{font-size:24px;font-family:var(--serif);color:var(--crimson)}
.ingest{margin-top:18px;height:54px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-2);overflow:hidden;position:relative}
.ingest::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(138,21,56,.12),transparent);transform:translateX(-100%)}
.ingest.run::before{animation:sweep 1.1s var(--ease) infinite}
@keyframes sweep{to{transform:translateX(100%)}}

.fmhead{display:flex;align-items:baseline;gap:10px;margin-bottom:22px}
.badge{font-size:13px;color:var(--ink-2);padding:6px 12px;border-radius:8px;background:var(--surface-2)}
.calib{display:grid;grid-template-columns:480px 1fr;gap:52px;align-items:start}

.cands{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cand{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 20px;display:flex;flex-direction:column;gap:12px;min-height:250px;position:relative;overflow:hidden}
.cand::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--crimson)}
.cand .rk{font-size:12.5px;color:var(--ink-3)}
.cand .dx{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.3;min-height:56px}
.cand .p{font-size:42px;font-family:var(--serif);font-weight:700;line-height:1;color:var(--crimson);font-variant-numeric:tabular-nums}
.cand .p small{font-size:13px;font-family:var(--sans);font-weight:500;color:var(--ink-3);margin-left:6px}
.cand .why{font-size:13.5px;color:var(--ink-2);line-height:1.55}
.cand .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}.cand .bar i{display:block;height:100%;background:var(--crimson);width:0;transition:width 1s var(--spring)}
.rules{margin-top:26px;display:flex;gap:28px;font-size:14px;color:var(--ink-2);flex-wrap:wrap}.rules b{color:var(--ink)}

.guess{display:grid;grid-template-columns:1fr 380px;gap:44px;align-items:start}
.gopts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gopts .opt{min-height:70px;justify-content:space-between;font-size:17px}
.gopts .opt .p{font-family:var(--serif);color:var(--ink-3);font-size:16px}
.gopts .opt.on .p{color:var(--crimson-2)}

.result{display:grid;grid-template-columns:1fr 360px;gap:40px;align-items:start}
.rhead{display:grid;grid-template-columns:1fr 110px 90px 90px 110px;gap:12px;padding:0 20px 8px;font-size:12.5px;color:var(--ink-3)}
.rhead span:last-child{text-align:right}
.result .rrow{grid-template-columns:1fr 110px 90px 90px 110px;gap:12px}
.you{font-size:13.5px;font-weight:600}.you.y{color:var(--crimson)}.you.n{color:var(--ink-3)}

/* ---- 시간 비교 ---- */
.axiswrap{display:grid;grid-template-columns:1fr 318px;gap:34px;align-items:start}
.tlcard{padding:26px 30px 18px}
.trow{display:grid;grid-template-columns:142px 1fr;gap:20px;align-items:end}
.trow.rl{align-items:start}
.rlab{font-family:var(--serif);font-size:18px;font-weight:700;text-align:right;line-height:1.3;white-space:nowrap}
.rlab.r{padding-top:70px}
.rlab.m{color:#1F5FA8}.rlab.r{color:var(--ink-2)}
.trk{position:relative}
.trk.m{height:104px}
.trk.r{height:210px}
.ln{position:absolute;height:3px;border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
.ln.on{transform:scaleX(1)}
.ln.r{left:0;right:0;top:84px;background:var(--ink-3)}
.ln.m{bottom:6px;background:linear-gradient(90deg,#1F5FA8 0%,#1F5FA8 62%,rgba(31,95,168,0) 100%)}
.ln.m.pull{transform-origin:right;background:linear-gradient(90deg,rgba(31,95,168,0) 0%,#1F5FA8 42%,#1F5FA8 100%)}
.mnd{position:absolute;bottom:7px;width:16px;height:16px;border-radius:50%;background:#1F5FA8;border:3px solid var(--white);transform:translate(-50%,50%) scale(0);transition:transform .45s var(--spring);z-index:3}
.mnd.in{transform:translate(-50%,50%) scale(1)}
.mco{position:absolute;bottom:28px;width:300px;opacity:0;transition:opacity .45s;z-index:3}
.mco.in{opacity:1}
.mco b{display:block;font-family:var(--serif);font-size:19px;font-weight:700;color:#1F5FA8;line-height:1.35;word-break:keep-all}
.mco span{display:block;font-size:13px;color:var(--ink-2);line-height:1.45;margin-top:3px;word-break:keep-all}
.nd{position:absolute;width:15px;height:15px;border-radius:50%;transform:translate(-50%,0) scale(0);transition:transform .4s var(--spring);z-index:3}
.nd.in{transform:translate(-50%,0) scale(1)}
.nd.m{bottom:0;background:#1F5FA8}
.nd.r{top:78px;background:var(--ink-3)}
.nd.r.key{background:var(--crimson);width:17px;height:17px;top:77px}
.ldr{position:absolute;width:1.5px;background:var(--line-2);transform:scaleY(0);transition:transform .35s var(--ease);z-index:1}
.ldr.in{transform:scaleY(1)}
.ldr.m{bottom:14px;height:30px;transform-origin:bottom}
.ldr.up{bottom:calc(100% - 80px);height:26px;transform-origin:bottom}
.ldr.down{top:98px;height:30px;transform-origin:top}
.ldr.key{background:var(--crimson)}
.co{position:absolute;width:290px;transform:translateX(-50%);opacity:0;transition:opacity .4s;z-index:3;text-align:center}
.co.in{opacity:1}
.co.el{transform:none;left:0 !important;text-align:left}
.co.er{transform:translateX(-100%);text-align:right}
.co b{display:block;font-size:15px;font-weight:600;line-height:1.4;word-break:keep-all}
.co span{display:block;font-size:13px;color:var(--ink-2);line-height:1.45;margin-top:3px;word-break:keep-all}
.rankbox{background:var(--tint);border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.55;color:var(--ink-2);margin-bottom:4px}
.rankbox b{color:var(--ink);font-weight:600}
.rankbox em{font-style:normal;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--crimson)}
.trajlist{margin:16px 0 6px;display:flex;flex-direction:column;gap:10px}
.tj{display:grid;grid-template-columns:50px 42px 1fr;gap:9px;align-items:baseline;font-size:13px;line-height:1.45}
.tj .t{color:var(--ink-3);font-variant-numeric:tabular-nums}
.tj .v{font-family:var(--serif);font-weight:700;color:#1F5FA8;font-variant-numeric:tabular-nums;font-size:15px}
.tj .d{color:var(--ink-2)}
.tj.obs .d{color:var(--ink)}
.co.up{bottom:calc(100% - 54px)}
.co.down{top:130px}
.co.key b{color:var(--crimson)}
.rug{position:absolute;top:79px;width:1px;height:12px;background:var(--line-2);opacity:0;transition:opacity .5s}
.tick{position:absolute;top:87px;width:1px;height:11px;background:var(--line-2);opacity:0;transition:opacity .4s}
.tlab{position:absolute;top:101px;transform:translateX(-50%);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .4s;background:var(--white);padding:2px 7px;z-index:2;white-space:nowrap}
.gaplist{margin:4px 0 14px;display:flex;flex-direction:column;gap:7px}
.gl{font-size:13px;line-height:1.5;color:var(--hold);padding-left:13px;position:relative}
.gl::before{content:"";position:absolute;left:0;top:8px;width:7px;height:0;border-top:2px dashed var(--hold)}
.axlab{text-align:center;font-size:13.5px;color:var(--ink-3);margin-top:4px}
.tlside{position:sticky;top:0}
.tlside .big{font-family:var(--serif);font-size:56px;font-weight:700;color:var(--hold);line-height:1;font-variant-numeric:tabular-nums}
.tlside .cap{font-size:14px;color:var(--ink-2);margin:8px 0 20px;line-height:1.5}
.tlside .stat{align-items:start;gap:14px}
.tlside .stat span{flex:none}
.tlside .stat b{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink);text-align:right;line-height:1.45;white-space:normal}
.tlside .sum{font-size:14.5px;line-height:1.65;color:var(--ink-2);padding-top:16px;border-top:1px solid var(--line);margin-top:4px}
@media (max-width:1100px){.axiswrap{grid-template-columns:1fr}.trow{grid-template-columns:96px 1fr;gap:12px}.rlab{font-size:15px}.co{width:200px}}

.learn{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:stretch}
.lp{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:12px;min-height:440px;transition:opacity .4s,transform .4s}
.lp.dim{opacity:.35;pointer-events:none;transform:scale(.985)}
.lp .lt{font-family:var(--serif);font-size:19px;font-weight:700}
.lp .ld{font-size:13.5px;color:var(--ink-2)}
.lp .body{flex:1;display:flex;flex-direction:column;gap:10px}
.lp .btn{align-self:flex-start}
.bank{display:flex;flex-direction:column;gap:6px}
.bank .br{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--surface)}
.bank .br b{color:var(--bad)}.bank .br em{color:var(--hold);font-style:normal}
.bank .br.new{background:var(--bad-t);animation:pop .4s var(--spring) both}
.doc{background:var(--surface);border-radius:12px;padding:14px;font-size:13.5px;line-height:1.6;color:var(--ink);border-left:3px solid var(--line-2)}
.doc .ins{background:var(--hold-t);color:#7A4E0A;border-radius:3px;padding:0 3px}
.doc .ttl{font-size:12px;color:var(--ink-3);margin-bottom:6px}
.gate{display:flex;flex-direction:column;gap:10px}
.dots{position:relative;height:120px;background:var(--surface);border-radius:12px;overflow:hidden}
.dots .zero{position:absolute;top:0;bottom:0;width:1px;background:var(--ink-3);left:50%}
.dots .d{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--crimson);opacity:0;transform:scale(.4);transition:opacity .3s,transform .3s}
.dots .d.in{opacity:.6;transform:none}
.dots .ci{position:absolute;height:6px;top:calc(100% - 22px);background:var(--hold);border-radius:3px;width:0;transition:width .8s var(--spring),left .8s var(--spring),background .4s}
.dots .ci.ok{background:var(--ok)}.dots .ci.bad{background:var(--bad)}
.dots .mean{position:absolute;top:calc(100% - 28px);width:2px;height:18px;background:var(--ink);opacity:0;transition:opacity .4s,left .8s var(--spring)}
.dots .lbl{position:absolute;font-size:11px;color:var(--ink-3);bottom:2px}
.gate .stat{border-top:0;padding:4px 0}.gate .stat b{font-size:15px;font-family:var(--sans);color:var(--ink)}
.gate .vd{padding:12px;border-radius:10px;text-align:center;font-weight:700;opacity:0;transition:opacity .4s}
.gate .vd.ok{background:var(--ok-t);color:var(--ok);opacity:1}.gate .vd.bad{background:var(--bad-t);color:var(--bad);opacity:1}
.pieces{display:flex;flex-direction:column;gap:8px}
.piece{padding:10px 12px;border-radius:9px;font-size:13.5px;background:var(--surface);border:1px solid transparent}
.piece.hi{border-color:var(--hold);background:var(--hold-t)}
.piece .pt{font-size:12px;color:var(--ink-3);margin-bottom:3px}

/* ---- 왜 필요한가 ---- */
.whygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:8px}
.wt{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px 24px 22px;min-height:230px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;animation:pop .5s var(--spring) both}
.wt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--crimson);transform:scaleY(0);transform-origin:top;transition:transform .6s var(--ease)}
.wt.on::before{transform:scaleY(1)}
.wt .k{font-size:13px;color:var(--crimson);font-weight:600}
.wt .n{font-family:var(--serif);font-size:54px;font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wt .n small{font-size:20px;margin-left:4px}
.wt .d{font-size:14.5px;color:var(--ink-2);line-height:1.55}
.wt .s{font-size:12px;color:var(--ink-3);margin-top:auto}
.wt.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.wt.dark .n,.wt.dark .d{color:#fff}.wt.dark .k{color:#FF8FA8}.wt.dark .s{color:rgba(255,255,255,.55)}
.wt.dark::before{background:#FF8FA8}
.whyline{margin-top:28px;padding:22px 26px;border-radius:var(--r-lg);background:var(--tint);display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.whyline .q{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--crimson);white-space:nowrap}
.whyline .a{font-size:15.5px;color:var(--ink);line-height:1.6}
/* ---- 환자 선택 축 그룹 ---- */
.axisgrp{margin-bottom:26px}
.axisgrp .gh{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.axisgrp .gh b{font-family:var(--serif);font-size:20px}
.axisgrp .gh span{font-size:13.5px;color:var(--ink-3)}
.pcard .cc{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:10px;background:var(--tint);border-left:3px solid var(--crimson)}
.pcard .cc .cl{font-size:11.5px;color:var(--crimson);font-weight:700;letter-spacing:.02em}
.pcard .cc .ct{font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.4}
.pcard .teaser{display:inline-flex;align-items:baseline;gap:6px;margin-top:2px}
.pcard .teaser b{font-family:var(--serif);font-size:24px;color:var(--crimson);line-height:1}
.pcard .teaser span{font-size:12.5px;color:var(--ink-2)}
.pcard .src{font-size:11.5px;color:var(--ink-3)}
/* ---- 주호소 ---- */
.chief{display:grid;grid-template-columns:64px 88px 1fr;gap:18px;align-items:center;padding:14px 16px;background:var(--tint);border-radius:12px;margin-bottom:8px;animation:pop .4s var(--spring) both}
.chief .t{color:var(--crimson);font-size:14px;font-weight:600}.chief .k{font-size:12.5px;color:var(--crimson);padding:3px 9px;border-radius:6px;background:rgba(138,21,56,.1);width:max-content;font-weight:600}
.chief .n{font-size:17px;font-weight:600;color:var(--ink)}
/* ---- 후보 카드 먼저 볼 검사 ---- */
.cand .first{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.cand .first .fl{font-size:11.5px;color:var(--crimson);font-weight:600;margin-bottom:6px}
.cand .first .fc{display:flex;flex-wrap:wrap;gap:5px}
.cand .first .fc span{font-size:12px;padding:4px 8px;border-radius:999px;background:var(--tint);color:var(--crimson);font-weight:600}
/* ---- 시간 비교 브래킷 ---- */
.brk{position:absolute;top:22px;height:22px;border-left:2px solid var(--hold);border-right:2px solid var(--hold);border-top:2px solid var(--hold);border-radius:6px 6px 0 0;transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease);z-index:2}
.brk.on{transform:scaleX(1)}
.brklab{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--hold);color:#fff;font-family:var(--serif);font-weight:700;font-size:15px;padding:5px 12px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .4s,transform .4s var(--spring);z-index:4}
.brklab.on{opacity:1;transform:translate(-50%,-110%)}
/* ---- 마무리 임팩트 ---- */
.impact{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.impact .it{background:var(--surface);border-radius:14px;padding:18px 20px}
.impact .it b{display:block;font-family:var(--serif);font-size:30px;color:var(--crimson);line-height:1.1}
.impact .it span{font-size:13.5px;color:var(--ink-2);line-height:1.5;display:block;margin-top:6px}
@media (max-width:1100px){.whygrid,.impact{grid-template-columns:repeat(2,1fr)}.whyline{grid-template-columns:1fr}}
@media (max-width:1100px){.pick,.window,.calib,.guess,.result{grid-template-columns:1fr}.cands,.learn{grid-template-columns:repeat(2,1fr)}.gopts{grid-template-columns:1fr}}
</style>
</head>
<body>
<script src="../logos.js"></script>
<script src="../shared.js"></script>
<script src="../demo_data.js"></script>
<script src="../omop_data.js"></script>
<script>
buildShell({ stages: ["왜 첫 시점인가", "환자 선택", "관찰창", "FM 확률", "LLM 보정", "후보", "경로 탐색", "나의 선택", "결과", "시간 비교", "학습"] });
let patients = PATIENTS.concat(OMOP_PATIENTS);
window.loadPatients = json => { patients = json; if (Router.current === 'pick') go('pick'); };
const S = { patient: null, guess: [] };
const NOTE = '샘플 케이스로 구성된 화면입니다. 실제 환자 로그는 서버 연결 후 같은 형식으로 교체됩니다.';
Router.onEnter = (name, idx) => { Router.note(idx ? NOTE : ''); Router.who(S.patient ? `${S.patient.name} · ${S.patient.axis}` : ''); };
const SC = {};

/* ---------- landing ---------- */
SC.landing = () => {
  Router.hint('');
  const visits = Store.get('ehr_demo1_visits', 0);
  $('#app').innerHTML = `<section class="scene landing">
    <svg class="ecg" viewBox="0 0 1600 160" preserveAspectRatio="none"><path d="${ecgPath()}"/></svg>
    <div>
      <div class="partners"><img src="${LOGO_KT}" alt="KT"><span class="x">×</span><img src="${LOGO_KU}" alt="고려대학교"><span class="lab">BREIN Lab</span></div>

/* ---------- tree ---------- */
async function runTreeUI(cands, treesOf, mine) {
  $('#app').querySelector('.trees').innerHTML = cands.map(c => `<div class="tree ${mine === c.dx ? 'mine' : ''}" data-dx="${esc(c.dx)}"><div class="th"><div class="dx">${esc(c.dx)}</div><div class="p"><span>현재 확률</span><b class="num cp">${fmt(c.p)}</b></div></div><div class="rounds"></div><div class="vwrap"><span class="wait"><i></i>라운드 진행 중</span></div></div>`).join('');
  const run = async (c, delay) => {
    await wait(delay); const el = $(`.tree[data-dx="${CSS.escape(c.dx)}"]`); const rounds = treesOf(c.dx);
    for (const r of rounds) {
      const x = document.createElement('div'); x.className = 'round ' + (r.judge === 'llm' ? 'llm' : '');
      const fetched = r.fetched.map(f => typeof f === 'string' ? f : f.name + ' ' + f.text);
      x.innerHTML = `<div class="rt"><span>라운드 ${r.round}</span><span class="pp num">${fmt(r.before)} → ?</span></div><div class="rq"><b class="rl">요청</b>${r.request.length ? esc(r.request.join(' · ')) : '없음'}</div><div class="rf ${fetched.length ? '' : 'none'}"><b class="rl">조회</b>${fetched.length ? esc(fetched.join(' · ')) : '새로 가져올 기록 없음'}</div><div class="lt"></div>`;
      el.querySelector('.rounds').appendChild(x); await wait(650);
      x.querySelector('.pp').textContent = `${fmt(r.before)} → ${fmt(r.after)}`; countTo(el.querySelector('.cp'), r.before, r.after, 500); await wait(300);
      await typeInto(x.querySelector('.lt'), (r.judge === 'auto' ? '임계값 판정 · ' : 'LLM 판정 · ') + r.text, 70); await wait(200);
    }
    const last = rounds[rounds.length - 1];
    const cls = last.verdict === '확정' ? 'ok' : last.verdict === '배제' ? 'out' : 'unc';
    el.classList.add(cls);
    el.querySelector('.vwrap').innerHTML = stampHTML(last.verdict, last.verdict === '확정' ? '최종 목록에 포함' : last.verdict === '배제' ? '최종 목록에서 제외' : last.after >= 0.6 ? '불확실 · 목록에 포함' : '불확실 · 목록에 미포함');
    stampIn(el.querySelector('.stamp'));
  };
  await Promise.all(cands.map((c, i) => run(c, i * 550)));
}

  const p = S.patient; if (!p) return go('pick');
  Router.hint('후보 5개가 동시에 라운드를 돕니다. 확정·배제 도장이 찍히는 순간을 지켜보세요'); $('#skip').style.visibility = 'visible';

function finalVerdicts(p) {
  return p.candidates.map(c => { const rs = p.trees[c.dx]; const l = rs[rs.length - 1]; const included = l.verdict === '확정' || (l.verdict === '불확실' && l.after >= 0.6); const truth = p.truth.includes(c.dx); return { dx: c.dx, p0: c.p, p1: l.after, verdict: l.verdict, included, truth, hit: included === truth }; });
}

/* ---------- result ---------- */
SC.result = async () => {
  const p = S.patient; if (!p) return go('pick');
  Router.hint('당신의 선택, EHR Agent의 판정, 그리고 퇴원 진단을 나란히 봅니다');
  const rows = finalVerdicts(p);
  const missed = p.truth.filter(t => !p.candidates.some(c => c.dx === t)).map(t => ({ dx: t, p0: p.fm[t] ?? 0, p1: null, verdict: '후보 미선정', included: false, truth: true, hit: false }));
  const all = [...rows, ...missed];
  const mHits = all.filter(r => r.hit).length; const uHits = all.filter(r => S.guess.includes(r.dx) === r.truth).length;
  const calls = Object.values(p.trees).reduce((s, rs) => s + rs.length * 2, 0) + 4;
  $('#app').innerHTML = `<section class="scene">
    <div class="head"><div><h2>결과 — 당신, EHR Agent, 그리고 퇴원 진단</h2><p class="lead">최종 진단은 며칠에서 몇 주 뒤에야 코딩되는 정답입니다. EHR Agent는 관찰창 기록에서 시작했고, 당신은 EHR Agent의 경로 탐색을 본 뒤에 골랐습니다.</p></div></div>
    <div class="result"><div>
      <div class="rhead"><span>진단</span><span>초기 → 최종</span><span>EHR Agent</span><span>나의 선택</span><span>퇴원 진단 대조</span></div>
      <div class="rlist">${all.map((r, i) => `<div class="rrow ${r.hit ? 'hit' : 'miss'}" style="animation-delay:${i * 90}ms">
        <span class="dx">${esc(r.dx)}<small>${r.truth ? '퇴원 진단에 있음' : '퇴원 진단에 없음'}</small></span>
        <span class="num">${fmt(r.p0)} → ${r.p1 === null ? '—' : fmt(r.p1)}</span>
        <span><span class="chip ${r.verdict === '확정' ? 'crim' : r.verdict === '배제' ? 'out' : r.verdict === '후보 미선정' ? 'bad' : 'hold'}">${r.verdict}</span></span>
        <span class="you ${S.guess.includes(r.dx) ? 'y' : 'n'}">${S.guess.includes(r.dx) ? '있다' : '없다'}${S.guess.includes(r.dx) === r.truth ? ' ✓' : ''}</span>
        <span class="mark">${r.hit ? (r.truth ? 'Agent 맞음' : 'Agent 맞음') : (r.truth ? 'Agent 놓침' : 'Agent 과잉')}</span></div>`).join('')}</div></div>
      <aside class="score"><div class="big num">${mHits} / ${all.length}<small>EHR Agent 일치</small></div>
        <div class="row"><span>나의 선택 일치</span><b class="num">${uHits} / ${all.length}</b></div>
        <div class="badge ${uHits > mHits ? 'ok' : uHits === mHits ? 'ok' : 'bad'}">${uHits > mHits ? '당신이 EHR Agent보다 앞섰습니다' : uHits === mHits ? 'EHR Agent와 같은 점수입니다' : '이번엔 EHR Agent가 앞섰습니다'}</div>
        <div class="row"><span>확정 / 배제 / 불확실</span><b>${rows.filter(r => r.verdict === '확정').length} / ${rows.filter(r => r.verdict === '배제').length} / ${rows.filter(r => r.verdict === '불확실').length}</b></div>
        <div class="row"><span>LLM 호출</span><b class="num">약 ${calls}회</b></div>
        <div class="row"><span>판정 근거 문장</span><b class="num">${Object.values(p.trees).reduce((s, rs) => s + rs.length, 0)}개</b></div>
        <p class="notice">${mHits === all.length ? '최종 목록이 퇴원 진단과 완전히 일치합니다.' : `EHR Agent가 틀린 ${all.length - mHits}건은 다음 단계에서 오류 은행으로 들어갑니다.`}</p></aside></div></section>`;
  await wait(300); Router.ready('시간 비교 보기');
};

          </div></div>
        <div class="trow rl"><span class="rlab r">실제 진료 기록</span>
          <div class="trk r" id="rtrk">
            <i class="ln r" id="lnr"></i>
            <i class="brk" id="brk" style="left:${X(obs.at)}%;width:${Math.max(0, X(big.to) - X(obs.at))}%"></i>

            ${T.ticks.map((t, i) => `<i class="tick" style="left:${X(t)}%"></i>
              <span class="tlab" style="left:${X(t)}%">${esc(tickLab(t, i))}</span>`).join('')}
            ${T.real.map((e, i) => {

              return `<i class="ldr ${sd}${e.key ? ' key' : ''}" data-ev="${i}" style="left:${x}%"></i>

            }).join('')}
          </div></div>
        <div class="trow"><span></span><div class="axlab">${esc(T.axisLabel)}</div></div>
      </div>
      <aside class="card tlside">

        ${T.rank ? `<div class="rankbox"><b>${esc(T.rank.at)}</b> 시점, 관찰창 기록만으로<br>

        <div class="trajlist">${T.traj.map(t => `<div class="tj${t.obs ? ' obs' : ''}">

        <div class="gaplist">${T.gaps.map(g => `<div class="gl">${esc(g.label)}</div>`).join('')}</div>
        ${rows.map(r => `<div class="stat"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}
        ${T.minorLabel ? `<div class="stat"><span>기록 눈금</span><b>${esc(T.minorLabel)}</b></div>` : ''}
        <p class="sum" id="tlsum"></p>
      </aside>
    </div>
    <p class="note" style="margin-top:20px;font-size:13.5px;color:var(--ink-3);line-height:1.6;max-width:940px">${esc(T.trackNote)}</p>
    </section>`;

  // 라벨이 트랙 밖으로 나가 세로로 눌리지 않도록 픽셀 단위로 가두기

};

/* ---------- learn ---------- */
SC.learn = () => {
  const p = S.patient; if (!p) return go('pick'); const L = p.learning;
  Router.hint('왼쪽 카드부터 차례로 눌러 보세요. 틀린 판정이 규칙 문서로 들어가 EHR Agent가 스스로 고치는 과정입니다');

    <div class="head"><div><h2>학습 축 — 틀린 판정이 규칙 문서로 들어가는 길</h2><p class="lead">모델 가중치는 바뀌지 않습니다. 오류를 모으고, LLM이 규칙 문서를 한 줄 고치고, 같은 환자 40명에서 짝지어 검정한 뒤, 통과한 편집만 다음 환자에 반영합니다.</p></div></div>

        <div class="body"><div class="bank" id="bank">${L.bank.map(b => `<div class="br"><span>${esc(b.dx)}</span><span>놓침 <b class="num">${b.miss}</b></span><span>과잉 <em class="num">${b.over}</em></span></div>`).join('')}</div><div class="sub" id="bnote"></div></div>
        <button class="btn small primary" id="b1">이 환자의 오류 추가</button></div>

        <div class="body"><div class="doc"><div class="ttl">진단별 전략 문서 · ${esc(L.proposal.dx)}</div><div>확정 조건, 배제 조건, 주의점을 적은 짧은 규칙 문서. 600자 제한.</div><div id="prop" style="margin-top:8px"></div></div></div>
        <button class="btn small primary" id="b2">편집안 만들기</button></div>
      <div class="lp dim" id="l3"><div class="lt">통계 게이트</div><div class="ld">편집 전·후를 같은 환자 ${L.gate.n}명에서 비교. 환자별 개선폭의 부트스트랩 95% 신뢰구간 하한이 0을 넘어야 채택.</div>
        <div class="body gate"><div class="dots" id="dots"><div class="zero"></div><div class="ci" id="ci"></div><div class="mean" id="mean"></div><span class="lbl" style="left:8px">−</span><span class="lbl" style="left:calc(50% - 4px)">0</span><span class="lbl" style="right:8px">+</span></div>
          <div class="stat"><span>평균 개선폭</span><b id="gm">—</b></div><div class="stat"><span>95% 신뢰구간</span><b id="gci">—</b></div><div class="vd" id="vd"></div></div>
        <button class="btn small primary" id="b3">게이트 실행</button></div>
      <div class="lp dim" id="l4"><div class="lt">다음 환자에 반영</div><div class="ld">다음 환자의 판정 프롬프트는 세 조각으로 조립됩니다. 채택된 문서만 가운데에 들어갑니다.</div>
        <div class="body pieces"><div class="piece"><div class="pt">시스템 지시문</div>근거를 읽고 확정 / 배제 / 추가 조사 중 하나를 골라 이유를 써라</div>
          <div class="piece" id="pc2"><div class="pt">진단별 전략 문서</div><span id="pc2t">원본 문서 (편집 없음)</span></div>
          <div class="piece"><div class="pt">환자 기록 + FM 확률</div>관찰창 + 조회분, 이전 라운드 요약</div><div class="sub" id="hold"></div></div>

  $('#b3').onclick = async () => {

};
